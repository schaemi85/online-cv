experiences:
    - role: Senior Software Engineer Automation
      time: Jan 2024 - Present
      company: SIX Group AG, Zürich
      logo: six-logo.png
      details: |
          - Built a Temporal workflow to automate role and entitlement provisioning, reducing manual ticket handling and enabling self-service access management.
          - Developed SIX Terraform/OpenTofu Provider enabling Infrastructure as Code (IaC) for abstracted on-premises resources (Kong API Gateway, Tufin Firewall Rules & Objects, BMC Remedy ITSM).
          - Created several inner sourced Go Client libraries for the Automation ecosystem.
          - Developed a Go Microservice Application Scaffolding with its own CLI supporting initialization, upgrades and deployments.
          - Designed a solution to deliver infrastructure streamlined self-services, IaC, and an Internal Developer Portal, moving towards Platform Engineering.
          - Contributed to shaping and reviewing architecture documents and establishing automation standards.
          - Actively participated in the DevOps culture, promoting best practices and continuous improvement across teams.
          - Prepared and delivered technical presentations and bootcamps to share knowledge and foster a culture of learning within the organization.
    - role: Software Engineer
      time: Sep 2019 - Jan 2024
      company: SIX Group AG, Zürich
      logo: six-logo.png
      details: |
          - Developed a Self-Service Portal for the API Gateway Platform using ReactJS and Spring Boot APIs.
          - Created self-service automation solution with a microservice-oriented architecture (Spring Boot, Flowable, REST, OAuth2.0, MongoDB, Redis, Openshift/Helm).
          - Built a complex user data synchronization hub with Spring Batch and Redis to connect two platforms.
          - Managed operations for the API Gateway Platform, including regular on-call duties.
          - Served as SCRUM Master
