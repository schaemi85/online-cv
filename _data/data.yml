        - Continuous configuration management, maintenance and extension of IT-infrastructure
        and application to serve business demands
        - Automation and scripting
        - Support of operational processes, maintenance processes and new projects
        - Support of DevOps toolchain for extending the existing applications
    - role: Java Developer / <br />SAP CX Developer
