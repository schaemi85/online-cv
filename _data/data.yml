career-profile:
    title: Career Profile
    summary: |
      Experienced Software Engineer specializing in API development, infrastructure automation, and DevOps practices. Proficient in Java, Go, and JavaScript, with working knowledge of Python, and expertise in tools like OpenTofu/Terraform, Ansible, Docker, and Kubernetes for streamlining infrastructure and operations.

      Skilled in implementing infrastructure-as-code (IaC) solutions, including developing custom Terraform providers to meet unique business requirements. Currently at SIX Group in the Infrastructure and Operations department, I focus on building robust APIs, automation frameworks, and self-service platforms that empower teams to operate efficiently and scale effectively.

      Passionate about efficiency and innovation, I thrive on delivering solutions that enhance operational performance while minimizing complexity. With a commitment to continuous improvement, I stay at the forefront of technology trends to ensure seamless integration, scalability, and cost-effectiveness in every project.
